[project]
name = "axiom-slice"
version = "1.0.0"
description = "Authenticated, isolated OrcaSlicer service for the Creality K1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
axiom-slice-api = "axiom_slice.api:main"
axiom-slice-worker = "axiom_slice.worker:main"
axiom-slice = "axiom_slice.client:main"
axiom-slice-prune = "axiom_slice.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_slice"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
